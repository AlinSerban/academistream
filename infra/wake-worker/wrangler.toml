name = "academistream-wake"
main = "src/index.ts"
compatibility_date = "2025-03-01"
workers_dev = false

[[routes]]
pattern = "academistream.online/*"
zone_name = "academistream.online"

[[routes]]
pattern = "www.academistream.online/*"
zone_name = "academistream.online"

[[kv_namespaces]]
binding = "WAKE_KV"
id = "2be7e35655774aa3891454dec5a7dbbc"

# Idle stop is triggered by GitHub Actions (.github/workflows/demo-idle-stop.yml),
# not by a Cloudflare cron.

[vars]
AWS_REGION = "eu-central-1"
EC2_INSTANCE_ID = "i-0c8e42174984f3d6c"
# Elastic IP of the demo EC2 (update if you re-allocate)
ORIGIN_IP = "3.69.93.245"
IDLE_STOP_MINUTES = "20"
# Public gate: StartInstances only when URL has ?wake=<this> (same value in root README)
WAKE_GATE = "1c4b60b524e25fe5b4b2e277"

# Secrets:
#   npx wrangler secret put AWS_ACCESS_KEY_ID
#   npx wrangler secret put AWS_SECRET_ACCESS_KEY
#   npx wrangler secret put IDLE_TICK_SECRET   # required for GHA idle-tick
