name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test API
        run: npm test -w @academistream/api

      - name: Test Worker
        run: npm test -w @academistream/worker

      - name: Build Web
        run: npm run build -w @academistream/web