name: Demo idle stop

# Idle stop now runs on the Cloudflare Worker cron (every 20m).
# GitHub Actions curl to /__wake/idle-tick fails under Bot Fight Mode (JS challenge).
# Keep this workflow for optional manual runs only if you temporarily disable BFM
# or call idle-tick from a browser; schedule is disabled on purpose.
on:
  workflow_dispatch:

jobs:
  idle-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call wake idle-tick
        env:
          IDLE_TICK_SECRET: ${{ secrets.WAKE_IDLE_TICK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${IDLE_TICK_SECRET}" ]; then
            echo "Missing repo secret WAKE_IDLE_TICK_SECRET (same value as Cloudflare IDLE_TICK_SECRET)."
            exit 1
          fi
          echo "Note: with Bot Fight Mode on, this curl often gets a challenge HTML/403."
          echo "Prefer the Worker cron trigger for idle stop."
          curl -fsS \
            -H "Authorization: Bearer ${IDLE_TICK_SECRET}" \
            -H "Accept: application/json" \
            "https://academistream.online/__wake/idle-tick"
          echo
